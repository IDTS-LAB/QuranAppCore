services:
  db:
    image: postgres:16-alpine
    container_name: quran-db-dev
    restart: unless-stopped
    environment:
      POSTGRES_USER: gorm
      POSTGRES_PASSWORD: gorm
      POSTGRES_DB: gorm
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U gorm -d gorm"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s

  # S3-compatible object storage (MinIO). The app talks to it with the AWS
  # SDK for Go v2 using path-style addressing against :9000.
  # API: http://localhost:9000 | Console: http://localhost:9001
  minio:
    image: quay.io/minio/minio:latest
    container_name: quran-minio-dev
    restart: unless-stopped
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - miniodata:/data
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:9000/minio/health/live || exit 1"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s

volumes:
  pgdata:
  miniodata:
